[pytest]
# Perf tests measure wall-clock latency against a fixed budget. On a
# contended machine (parallel agents, shared CI runner) subprocess-exec
# timing swings past any budget that still catches a real regression when
# the box is quiet — see docs/ai/memory/active.md for the measured numbers
# that made this opt-in rather than loosened or deleted. Excluded by default;
# run them explicitly with `pytest -m perf`.
markers =
    perf: latency/throughput test, excluded by default (run explicitly with -m perf)
addopts = -m "not perf"
