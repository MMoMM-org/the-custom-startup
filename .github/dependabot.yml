version: 2

updates:
  # Action majors go stale silently. The only signal that this repo was still
  # on Node 20 was a warning buried in every job log — "actions/checkout@v4
  # targets Node.js 20 but is being forced to run on Node.js 24" — which nobody
  # reads until something breaks. Dependabot turns that into a pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for the batch rather than five. These move together in practice
      # (a runtime bump lands across all first-party actions at once) and the
      # suites run on the PR either way.
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
