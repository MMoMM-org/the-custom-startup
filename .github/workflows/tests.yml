name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guards the documentation surfaces a change is expected to move with it.
  # Only meaningful on a pull request: it reads the diff against the base and
  # the pull request body, and neither exists on a push to main.
  docs-sync:
    name: docs-sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against the merge base, which a shallow clone does
          # not contain.
          fetch-depth: 0

      - name: Collect the changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only FETCH_HEAD...HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed in this pull request:"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"

      # The body is text the pull request author controls. Interpolating it into
      # `run:` with ${{ }} would paste it into the shell script the runner
      # executes; passing it through the environment keeps it data.
      - name: Write the pull request body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Check documentation surfaces
        run: |
          bash scripts/ci/check-docs-sync.sh \
            --changed-files "$RUNNER_TEMP/changed.txt" \
            --pr-body "$RUNNER_TEMP/pr-body.md"

  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Collected from the repo root, not from tests/ — the root conftest.py
      # sets the collection rules and several suites live next to the code they
      # cover (plugins/*/tests/, plugins/tcs-helper/scripts/lib/).
      - name: Run pytest
        run: pytest -q

  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: the whole point of the second OS is seeing which of
      # the two disagrees, and a cancelled job answers nothing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Several bats suites shell out to `python3 -c "import yaml"` to validate
      # YAML frontmatter and workflow files, so the python deps are needed here
      # too — not just in the pytest job.
      - name: Install python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Not `npm install -g`: bats ships man pages, and linking those into
      # /usr/local/share/man fails with EACCES on the hosted runner. Installing
      # under a prefix we own avoids needing sudo at all, and mirrors what
      # scripts/dev/test.sh does locally.
      - name: Install bats
        run: |
          npm install --prefix "$RUNNER_TEMP/bats" --no-save bats@1.13.0
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"

      # Fixtures that build throwaway repos rely on a committer identity being
      # resolvable. Most set their own, but not all.
      - name: Configure git identity for fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      # actions/checkout leaves the working copy on a detached HEAD. Several
      # bats suites invoke the guard hooks against the checkout itself, and the
      # guard deliberately bypasses on a detached HEAD ("bypass: detached-HEAD")
      # — so every deny assertion fails. Give HEAD a branch name. It must not be
      # a protected one, or the branch-protection paths change behaviour too.
      - name: Attach HEAD to a branch
        run: git checkout -q -B ci/test-run

      # Recorded because the two runners disagree in ways this suite cares
      # about: BSD vs GNU regex, grep and sed, and /bin/bash 3.2.57 on macOS
      # against 5.x on ubuntu. When one OS fails and the other does not, this
      # is the first thing worth reading.
      - name: Record the shell and tool versions under test
        run: |
          printf 'uname:        %s\n' "$(uname -s) $(uname -m)"
          printf 'bash on PATH: %s\n' "$(bash --version | head -1)"
          printf '/bin/bash:    %s\n' "$(/bin/bash --version | head -1)"
          printf 'grep:         %s\n' "$(grep --version 2>&1 | head -1)"
          printf 'sed:          %s\n' "$(sed --version 2>&1 | head -1 || echo 'BSD sed (no --version)')"

      # The suite's wall-clock budgets come from SDD requirements measured on a
      # developer machine. A hosted runner is shared hardware and the timing
      # harness itself costs milliseconds, so the raw numbers measure the runner
      # as much as the code — macos-latest clocked p99=56ms against a 50ms
      # budget with no regression behind it. A factor of 4 still fails a real
      # regression (50ms becoming 2s) while tolerating the noise floor; locally
      # the factor is 1 and the specified budget is enforced exactly.
      - name: Run bats
        env:
          TCS_PERF_SLACK: "4"
        # tests/bats is listed separately because it is flat (no subdirectories) and so cannot be reached by the plugins/*/tests/bats glob, no matter what --recursive does.
        run: bats --recursive --print-output-on-failure plugins/*/tests/bats tests/bats
