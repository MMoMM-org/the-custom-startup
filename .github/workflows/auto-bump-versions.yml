name: Auto-bump plugin versions

on:
  push:
    branches: [main]
  # What is owed is derived from main's history (issue #196), so any run
  # catches up on runs that never happened. Dispatch is for "now"; the
  # schedule covers a lost event on the last merge of the day.
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

# Queue runs instead of racing them (issue #93). Two PRs merging seconds apart
# used to produce two concurrent runs, each checked out at its own commit;
# whichever pushed second lost a non-fast-forward and its bump was gone. Never
# cancel-in-progress here: a run mid-push should finish. A queued run that is
# superseded is harmless — the next run catches up on whatever it owed.
concurrency:
  group: auto-bump-versions-main
  cancel-in-progress: false

jobs:
  bump:
    # head_commit is null on dispatch and schedule, so those always run. The
    # ref guard keeps a dispatch from another branch from pushing to main.
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: what is owed is read from main's history, back to
          # each plugin's last version raise. A shallow clone is refused.
          fetch-depth: 0

      - name: Configure committer
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # The retry loop lives in a script rather than inline here so it can be
      # exercised by tests/test_bump_and_push.py, which reproduces the race
      # against a real remote that rejects the first push.
      - name: Bump and push, retrying if main moved underneath
        env:
          MAX_ATTEMPTS: "5"
        run: bash scripts/ci/bump-and-push.sh

      # The state this bug used to leave behind: a CHANGELOG documenting a
      # version the manifest never carried. Strict here (--allow-ahead 0) —
      # on main the bump has already happened, so any gap is a real one. The
      # pull-request side runs the same script with --allow-ahead 1 via
      # tests/test_check_changelog_version_sync.py, where an entry naming the
      # about-to-be-produced version is expected.
      - name: Verify every documented version actually shipped
        if: always()
        run: |
          # Check what is actually on main, not the local tree: if the push
          # loop gave up, the bump is sitting here uncommitted-to-remote and
          # would make the check pass while main stays inconsistent.
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          bash scripts/ci/check-changelog-version-sync.sh --allow-ahead 0
